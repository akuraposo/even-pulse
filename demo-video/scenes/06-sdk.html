<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="../ui.css">
  <link rel="stylesheet" href="../evenpulse-ui.css">
  <script src="../icons.js"></script>
  <script src="../motion.js"></script>
  <script src="../out/anchors.js"></script>
  <script src="../lib/words.js"></script>
  <style>
    /* 3-Tile Bento Grid strictly inside 5vh..95vh safe area */
    .s6-bento {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
      gap: calc(var(--u) * 2.8);
      align-items: center;
      padding-top: calc(var(--u) * 4);
    }
    .s6-bento > * {
      min-width: 0;
    }
    .s6-right {
      display: flex;
      flex-direction: column;
      gap: calc(var(--u) * 1.4);
      min-width: 0;
    }
    .tele-crop {
      max-height: calc(var(--u) * 38);
      width: 100%;
      object-fit: cover;
      object-position: top;
    }
    .menu-crop {
      max-height: calc(var(--u) * 64);
      width: 100%;
      object-fit: cover;
      object-position: top;
    }
    .proof-card {
      background: #0d1613;
      border: 1.5px solid rgba(52, 255, 138, 0.34);
      border-radius: calc(var(--u) * 1.6);
      padding: calc(var(--u) * 1.3) calc(var(--u) * 1.6);
      display: flex;
      flex-direction: column;
      gap: calc(var(--u) * 1);
    }
    .proof-badges {
      display: flex;
      flex-wrap: wrap;
      gap: calc(var(--u) * 0.9);
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="ep-grid-floor"></div>

  <header class="hud">
    <p class="kicker m" style="--in:rise; --t:-0.2s;"><b>05</b> Official Even Hub SDK &amp; Live Proof</p>
  </header>

  <main class="stage">
    <div class="safe s6-bento">
      <!-- Tile 1: Real Captured Live App showing OS Contextual Menu + G2 Lens -->
      <div class="live-shot m" data-texture style="--in:left; --t:-0.2s;">
        <div class="live-bar">
          <span>G2 OS MENU</span>
          <span>v0.0.16</span>
        </div>
        <img class="menu-crop" src="../assets/live-os-menu.png" alt="Live G2 OS Contextual Menu">
      </div>

      <!-- Tile 2 & 3: Real Captured SDK Telemetry + Vitest / .ehpk / Slash Commands -->
      <div class="s6-right">
        <div class="live-shot m" data-texture style="--in:right; --t:0.15s;">
          <div class="live-bar">
            <span>even_hub_sdk</span>
            <span>TELEMETRY</span>
          </div>
          <img class="tele-crop" src="../assets/live-telemetry.png" alt="Live Even Hub SDK Event Stream">
        </div>

        <div class="proof-card m" style="--in:rise; --t:3.4s; --in-dur:0.55s;">
          <div class="proof-badges">
            <span class="ep-pill live"><i data-icon="shield"></i> 13/13 Vitest Passed</span>
            <span class="ep-pill"><i data-icon="package"></i> even-pulse.ehpk</span>
          </div>
          <div class="proof-badges m"
               style="--in:rise; --t:11.38s; --in-dur:0.45s;"
               data-sfx="pop" data-sfx-intent="appearance" data-sfx-vol="0.8">
            <span class="ep-pill live">/start</span>
            <span class="ep-pill live">/urgent</span>
            <span class="ep-pill live">/task</span>
            <span class="ep-pill live">/brief</span>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
